name: Golf Cart Monitor

on:
  schedule:
    # Runs every 2 hours (adjust as needed)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Grants permissions to push seen_golf_carts.txt back to repo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 curl_cffi playwright
          playwright install chromium --with-deps

      - name: Run Golf Cart Monitor
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python golf_cart_monitor.py

      - name: Save seen listings back to GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add seen_golf_carts.txt
          # Only commit and push if seen_golf_carts.txt actually changed
          git diff --staged --quiet || (git commit -m "Auto-update seen listings [skip ci]" && git push)