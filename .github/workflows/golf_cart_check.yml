name: Golf Cart Monitor

on:
  schedule:
    # Runs every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Grants permissions to push tracking files back to repo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 curl_cffi playwright
          playwright install chromium --with-deps

      - name: Run Nextdoor & OfferUp Monitor
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          NEXTDOOR_SESSION_ID: ${{ secrets.NEXTDOOR_SESSION_ID }}
        run: python golf_cart_monitor.py || true

      - name: Run Facebook Marketplace Monitor
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python fb_golf_cart_monitor.py || true

      - name: Upload Debug Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fb-marketplace-debug
          path: fb_debug.png

      - name: Commit and push updated tracking files & session
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add seen_ids.json seen_golf_carts.txt matched_golf_carts.csv fb_user_data/ || true
          git commit -m "Auto-update seen lists and Facebook session [skip ci]" || exit 0
          git push