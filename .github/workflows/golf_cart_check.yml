name: Golf Cart Monitor Check

on:
  schedule:
    # Runs hourly at 30 minutes past the hour
    - cron: '30 * * * *'
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  run-golf-cart-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 curl_cffi

      - name: Run Golf Cart Monitor Script
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python golf_cart_monitor.py

      - name: Commit and push updated seen_golf_carts.txt
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_golf_carts.txt || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen_golf_carts.txt [skip ci]" && git push)
