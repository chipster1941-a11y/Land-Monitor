name: Farmland Monitor Check

on:
  schedule:
    # Runs every hour (at minute 0)
    - cron: '0 * * * *'
  # Allows you to manually trigger the workflow from GitHub anytime
  workflow_dispatch:

jobs:
  check-farmland:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 curl_cffi

      - name: Run LandWatch Monitor
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python landwatch_monitor.py

      - name: Commit and Push Updated Memory File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_farms.txt
          git commit -m "Update seen farms memory [skip ci]" || echo "No changes to commit"
          git push