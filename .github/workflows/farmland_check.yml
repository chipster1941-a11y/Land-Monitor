name: Farmland Monitor Check

on:
  schedule:
    # Runs every hour on the hour
    - cron: '0 * * * *'
  # Allows manual triggers from the GitHub web UI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-farmland:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 curl_cffi

      - name: Run LandWatch Monitor
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python landwatch_monitor.py

      - name: Save Updated Memory File
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update seen farms memory [skip ci]"
          file_pattern: 'seen_farms.txt'