name: WI Lake Cabin Monitor

on:
  schedule:
    - cron: '0 */3 * * *' # Runs every 3 hours
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run WI Lake Cabin Monitor
        env:
          EMAIL_SENDER: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.RECIPIENT_EMAIL }}
        run: python wi_lake_cabin_monitor.py

      - name: Save seen listings back to GitHub
        run: |
          touch seen_cabins.txt
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add seen_cabins.txt
          git diff --staged --quiet || (git commit -m "Auto-update seen WI cabins [skip ci]" && git push)