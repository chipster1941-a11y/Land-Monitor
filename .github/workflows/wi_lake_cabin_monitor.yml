name: WI Lake Cabin Monitor

on:
  schedule:
    - cron: '0 */3 * * *' # Runs every 3 hours
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

          - name: Run WI Lake Cabin Monitor
          env:
            EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
            EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
            EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
            SENDER_EMAIL: ${{ secrets.EMAIL_SENDER }}
            SENDER_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
            RECIPIENT_EMAIL: ${{ secrets.EMAIL_RECEIVER }}
          run: python wi_lake_cabin_monitor.py

      # 2. This NEW step saves the updated JSON file back to your repo
      - name: Commit and Push Price History
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          touch lake_cabin_history.json
          git add lake_cabin_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update lake cabin price history" && git push)

      - name: Save seen listings back to GitHub
        run: |
          touch seen_cabins.txt
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add seen_cabins.txt
          git diff --staged --quiet || (git commit -m "Auto-update seen WI cabins [skip ci]" && git push)