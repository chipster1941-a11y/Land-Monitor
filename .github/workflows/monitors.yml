name: Property & Timeshare Monitors

on:
  schedule:
    # Runs twice daily at 12:00 AM and 12:00 PM UTC
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-monitors:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run Wi Property Monitor
        run: python wi_property_monitor.py
        continue-on-error: true

      - name: Run Golf Cart Monitor
        run: python fb_golf_cart_monitor.py
        continue-on-error: true

      - name: Run Timeshare Resale Monitor
        run: python timeshare_resale_monitor.py
        continue-on-error: true

      - name: Commit and Push state changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff-index --quiet HEAD || git commit -m "Auto-update monitor state files"
          git push