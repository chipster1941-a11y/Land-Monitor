name: WI Property Monitor

on:
  schedule:
    # Runs every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Grants permissions to push seen_properties.txt back to repo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps

      - name: Run WI Property Monitor
        env:
          EMAIL_SENDER: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.RECIPIENT_EMAIL }}
        run: python wi_property_monitor.py

      - name: Save seen listings back to GitHub
        run: |
          touch seen_properties.txt
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add seen_properties.txt
          # Only commit and push if seen_properties.txt actually changed
          git diff --staged --quiet || (git commit -m "Auto-update seen WI properties [skip ci]" && git push)
