name: GDV Inventory Monitor

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run GDV Inventory Monitor
        env:
          GDV_MEMBER_ID: ${{ secrets.GDV_MEMBER_ID }}
          GDV_PASSWORD: ${{ secrets.GDV_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: |
          python gdv_inventory_monitor.py

      - name: Commit and push state changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          if [ -f "seen_gdv_weeks.json" ]; then
            git add seen_gdv_weeks.json
            git diff-index --quiet HEAD || git commit -m "Automated update: seen_gdv_weeks.json"
            git push
          else
            echo "No state file found to commit."
          fi