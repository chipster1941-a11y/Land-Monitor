name: GDV Inventory Monitor

on:
  schedule:
    # Runs at :13 and :43 past the hour to avoid GitHub Actions queue delays
    - cron: '13,43 * * * *'
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run GDV Monitor
        env:
          GDV_MEMBER_ID: ${{ secrets.GDV_MEMBER_ID }}
          GDV_PASSWORD: ${{ secrets.GDV_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          run: python gdv_inventory_monitor.py

      - name: Commit and push updated seen state
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull --rebase origin main
          git add seen_gdv_weeks.json
          git diff-index --quiet HEAD || git commit -m "Update GDV seen inventory state"
          git push origin main